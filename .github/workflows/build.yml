name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      # ESTO TE FALTABA - Crea la carpeta android si no existe
      - run: flutter create . --platforms=android --project-name flash_tv
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Flash-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
